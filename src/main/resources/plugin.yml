name: Estudio
version: '${version}'

main: me.dego.estudio.Estudio
depend: [Vault]
api-version: '1.21.1'
load: POSTWORLD
author: degosacho

commands:
  itemname:
    description: Le pones el nombre con colores y gradientes al item que tengas en la mano
    usage: "Usage: /itemname <texto>"
  buscar:
    description: Busca un item en la tienda y abre su menu.
    usage: "Usage: /buscar [texto]"
    aliases: [buscartienda]

  llaves:
    description: Enseña tus llaves de las cajas y te deja comprarlas.
    usage: "Usage: /llaves [caja]"
    aliases: [llave, miscajas]

  cajas:
    description: Administración de las cajas del spawn.
    usage: "Usage: /cajas <lista|colocar|quitar|dar|poner|ver|recargar>"
    permission: estudio.cajas.admin

  holo:
    description: Crea y edita hologramas.
    usage: "Usage: /holo <crear|editar|texto|lista|borrar|...>"
    permission: estudio.holo.admin
    aliases: [holograma, hologramas]

  shopcapture:
    description: Captura el ítem en mano para usarlo en una tienda.
    usage: "Usage: /shopcapture"

  estudioreload:
    description: Recarga los yaml

  jobs:
    description: Abre el menú de selección de trabajo.
    usage: "Usage: /jobs"

  sethome:
    description: Comando para crear un home donde teletransportarte.
    usage: "Usage: /sethome <home>"

  home:
    description: Comando para ir a uno de tus hogares.
    usage: "Usage: /home [home]"

  homes:
    description: Accede a la lista de homes de tu usuario.
    usage: "Usage: /homes"

  delhome:
    description: Comando para eliminar un home.
    usage: "Usage: /sethome <home>"

  pico3x3:
    description: Te da un pico 3x3
    usage: "Usage: /pico3x3"

  pala3x3:
    description: Te da una pala 3x3
    usage: "Usage: /pala3x3"

permissions:
  estudio.holo.admin:
    description: Permite crear y editar hologramas
    default: op
  estudio.cajas.admin:
    description: Permite colocar y administrar las cajas y sus llaves
    default: op
  shop:
    description: Permite abrir los menus de la tienda
    default: true
  homes.limit.2:
    description: Permite tener hasta 2 homes
    default: true
  homes.limit.4:
    description: Permite tener hasta 4 homes
    default: false
  homes.limit.6:
    description: Permite tener hasta 6 homes
    default: false
  homes.limit.9:
    description: Permite tener hasta 9 homes
    default: false
  homes.limit.13:
    description: Permite tener hasta 13 homes
    default: false